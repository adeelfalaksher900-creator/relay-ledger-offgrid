name: Verify Relay Ledger

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build production app and offline package
        run: npm run build
      - name: Run all regression tests
        run: npm test
      - name: Verify deployment entry points
        run: |
          test -s dist/client/index.html
          test -s dist/server/index.js
          test -s dist/.openai/hosting.json
